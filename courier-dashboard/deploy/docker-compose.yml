services:
  dashboard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8000}:8000"
    environment:
      STORE_BACKEND: sqlite
      SIGHTINGS_DB_PATH: /data/sightings.sqlite3
      SIGHTING_TTL: "${SIGHTING_TTL:-7200}"
      INGEST_API_KEY: "${INGEST_API_KEY:-}"
      NOMINATIM_URL: "${NOMINATIM_URL:-}"
      GEOCODING_USER_AGENT: "${GEOCODING_USER_AGENT:-couriers-map/0.3}"
      VALHALLA_URL: "${VALHALLA_URL:-}"
      FEEDBACK_BOT_TOKEN: "${FEEDBACK_BOT_TOKEN:-}"
      FEEDBACK_CHAT_ID: "${FEEDBACK_CHAT_ID:-}"
      FEEDBACK_RATE_LIMIT: "${FEEDBACK_RATE_LIMIT:-5}"
    volumes:
      - sightings:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  sightings:
