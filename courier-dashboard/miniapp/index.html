<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Курьеры — карта</title>

  <script async id="telegram-sdk" src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <script defer src="vendor/leaflet/leaflet.js"></script>
  <script defer src="js/cities.js"></script>
  <script defer src="js/api.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>

  <!-- ЭКРАН 1: выбор города -->
  <main id="screen-city" class="screen screen-city" aria-labelledby="city-title">
    <div class="city-hero">
      <div class="logo-badge" aria-hidden="true">🌸</div>
      <h1 id="city-title" tabindex="-1">Карта курьеров</h1>
      <p class="subtitle">Выберите город, чтобы открыть карту</p>
    </div>
    <ul id="city-list" class="city-list" role="list"></ul>
    <noscript><p>Чтобы выбрать город и открыть карту, включите JavaScript в браузере.</p></noscript>
    <div class="hero-footer">Можно сменить город в любой момент</div>
  </main>

  <!-- ЭКРАН 2: карта города -->
  <main id="screen-map" class="screen screen-map" aria-labelledby="current-city-name" hidden>
    <header class="topbar">
      <h1 id="current-city-name" tabindex="-1">Город</h1>
      <button type="button" id="btn-change-city" class="control">
        Сменить город <span class="chev" aria-hidden="true">▾</span>
      </button>
    </header>

    <div class="map-tools">
      <div id="status-chip" class="status-chip status-loading" role="status">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="status-text">Загрузка…</span>
      </div>
      <div class="map-actions">
        <button type="button" id="btn-refresh" class="control">Обновить</button>
        <button type="button" id="btn-feedback" class="control">Сообщить о проблеме</button>
      </div>
    </div>
    <p id="map-note" class="map-note" role="status"></p>
    <div id="map" class="map" role="region" aria-label="Интерактивная карта"></div>
    <details id="street-panel" class="street-panel" hidden>
      <summary id="street-summary">Список улиц</summary>
      <ul id="street-list" class="street-list" role="list"></ul>
    </details>
  </main>

  <!-- Модальное окно обратной связи -->
  <dialog id="feedback-modal" class="modal" aria-labelledby="fb-title" aria-describedby="fb-hint">
    <form id="feedback-form" class="modal-card" novalidate>
      <h2 id="fb-title">Сообщить о проблеме</h2>
      <p id="fb-hint" class="modal-hint">Сообщение придёт владельцу приложения. Не указывайте личные данные.</p>
      <label for="feedback-text">Что работает неправильно?</label>
      <textarea id="feedback-text" maxlength="2000" rows="5" required aria-describedby="feedback-error"
        placeholder="Например, улица не подсвечивается"></textarea>
      <p id="feedback-error" class="feedback-error" role="alert"></p>
      <div class="modal-actions">
        <button type="button" id="fb-cancel" class="btn btn-ghost">Отмена</button>
        <button type="submit" id="fb-send" class="btn btn-primary">Отправить</button>
      </div>
    </form>
  </dialog>

  <!-- Тост-уведомление -->
  <div id="toast" class="toast hidden" role="status"></div>
</body>
</html>
