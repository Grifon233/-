# Аккаунты сборщика. Скопируй в accounts.yml и заполни (для api_hash нужны 32 hex-символа).
# ПРАВИЛО ПРОЕКТА: каждый аккаунт — строго через свой прокси. Без прокси не подключать!
# accounts.yml в git НЕ коммитим (он в .gitignore).

accounts:
  - name: acc1
    api_id: 123456            # из my.telegram.org
    api_hash: "0123456789abcdef0123456789abcdef"  # заменить, это не настоящий ключ
    phone: "+70000000000"     # только для первого входа с ALLOW_INTERACTIVE_LOGIN=1
    session: "sessions/acc1"  # отдельный файл Telethon, путь относительно accounts.yml
    proxy:                    # ОБЯЗАТЕЛЬНО
      type: socks5            # socks5 | http
      host: "192.0.2.10"       # заменить, это зарезервированный IP для примеров
      port: 1080
      username: "user"
      password: "pass"

  # - name: acc2
  #   ...
